<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Healthy Juice &amp; Shake - Rangoli Ice Cream</title>
  <style>
    body { background-color: #d32f2f; font-family: Arial, sans-serif; margin: 0; padding: 0; }
    .container { background-color: #fff; border-radius: 10px; padding: 15px; margin: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    header h2 { color: #d32f2f; margin: 0; }
    .back-link { text-decoration: none; color: #d32f2f; border: 2px solid #d32f2f; padding: 6px 10px; border-radius: 5px; font-weight: bold; transition: background 0.2s; }
    .back-link:hover { background-color: #ffe5e5; }
    .category-image { text-align: center; margin-bottom: 10px; }
    .category-image img { max-width: 200px; border-radius: 8px; }
    .menu-items { margin-top: 20px; }
    .menu-item.header { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 2px solid #d32f2f; font-weight: bold; color: #d32f2f; }
    .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed #d32f2f; }
    .menu-item:last-child { border-bottom: none; }
    .item-name { color: #d32f2f; }
    .price { color: #d32f2f; font-weight: bold; }
    footer { text-align: center; background-color: #fff; border-top: 2px solid #d32f2f; padding: 10px; margin-top: 20px; }
    footer a { color: #d32f2f; text-decoration: none; font-weight: bold; }
    footer a:hover { text-decoration: underline; }
    @media (max-width: 600px) { .container { margin: 10px; } .menu-item { font-size: 0.95em; } }
  </style>
</head>
<body>
